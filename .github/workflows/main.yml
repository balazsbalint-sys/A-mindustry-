name: Build UAW Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Unzip source
        run: unzip UAW-v8-fixed-source.zip
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        working-directory: uaw-fixed
        run: gradle jar
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UAW-mod
          path: uaw-fixed/build/libs/*.jar
